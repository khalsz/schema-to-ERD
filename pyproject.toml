[project]
name = "schema-to-erd"
version = "0.1.2"
description = "Converts JSON schema into simple ERD diagram"
authors = [{name="Khalid Lawal", email="khalid619lawal@gmail.com"}]
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "graphviz>=0.21",
    "pandas>=3.0.1",
]
[project.scripts]
schema-to-erd = "schema_to_erd.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "twine>=7.0.0",
]

[[tool.uv.index]]
name = "testpypi"
url = "https://test.pypi.org/simple/"
publish-url = "https://test.pypi.org/legacy/"
explicit = true
